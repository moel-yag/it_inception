services:

  # MARIADB database service
  mariadb:
    build:
      context: ./requirements/mariadb 
      dockerfile: Dockerfile
    image: mariadb
    container_name: mariadb
    restart: always
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_net
  
  # WORDPRESS (PHP-FPM) service
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wp_data:/var/www/html/wordpress
    networks:
      - inception_net

  # nginx service
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    env_file:
      - .env
    ports:
      - "443:443"
    volumes:
      - wp_data:/var/www/html/wordpress
    networks:
      - inception_net


volumes:
    db_data:
      driver: local
      driver_opts:
          type: none
          o: bind
          device: ${HOME}/data/mariadb
    wp_data:
      driver: local
      driver_opts:
          type: none
          o: bind
          device: ${HOME}/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

networks:
    inception_net:
      driver: bridge
